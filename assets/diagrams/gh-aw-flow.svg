<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">How an agentic workflow run is split into jobs</title>
  <desc id="d">An issue event starts the activation job, then the agent job runs Copilot with read-only permissions, the detection job scans the agent output, the safe outputs job applies approved writes such as labels and comments, and the conclusion job reports the result.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="1000" height="300" rx="18" fill="#f6f8fa"/>
  <g font-size="14">
    <g transform="translate(20 70)"><rect width="150" height="120" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="16" y="30" font-weight="700" fill="#0969da" font-size="12" letter-spacing="1">TRIGGER</text><text x="16" y="56" font-weight="700" fill="#1f2328">issues: opened</text><text x="16" y="80" fill="#57606a" font-size="13">or schedule,</text><text x="16" y="98" fill="#57606a" font-size="13">PR, command</text></g>
    <g transform="translate(205 70)"><rect width="150" height="120" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="16" y="30" font-weight="700" fill="#0969da" font-size="12" letter-spacing="1">1 ACTIVATION</text><text x="16" y="56" font-weight="700" fill="#1f2328">Role check,</text><text x="16" y="76" font-weight="700" fill="#1f2328">sanitise input,</text><text x="16" y="98" fill="#57606a" font-size="13">build the prompt</text></g>
    <g transform="translate(390 70)"><rect width="170" height="120" rx="14" fill="#0d1b34"/><text x="16" y="30" font-weight="700" fill="#5eead4" font-size="12" letter-spacing="1">2 AGENT</text><text x="16" y="56" font-weight="700" fill="#ffffff">Copilot engine,</text><text x="16" y="76" font-weight="700" fill="#ffffff">read-only token</text><text x="16" y="98" fill="#c9d6ea" font-size="13">writes are only buffered</text></g>
    <g transform="translate(595 70)"><rect width="150" height="120" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="16" y="30" font-weight="700" fill="#0969da" font-size="12" letter-spacing="1">3 DETECTION</text><text x="16" y="56" font-weight="700" fill="#1f2328">AI threat scan</text><text x="16" y="76" font-weight="700" fill="#1f2328">of the output</text><text x="16" y="98" fill="#57606a" font-size="13">blocks or warns</text></g>
    <g transform="translate(780 70)"><rect width="200" height="120" rx="14" fill="#dafbe1" stroke="#4ac26b"/><text x="16" y="30" font-weight="700" fill="#1a7f37" font-size="12" letter-spacing="1">4 SAFE OUTPUTS</text><text x="16" y="56" font-weight="700" fill="#1f2328">add-labels, add-comment,</text><text x="16" y="76" font-weight="700" fill="#1f2328">create-pull-request ...</text><text x="16" y="98" fill="#57606a" font-size="13">scoped write token</text></g>
  </g>
  <g stroke="#57606a" stroke-width="2" marker-end="url(#a)"><path d="M172 130h28"/><path d="M357 130h28"/><path d="M562 130h28"/><path d="M747 130h28"/></g>
  <text x="20" y="40" font-size="16" font-weight="700" fill="#1f2328">One agentic workflow run = several GitHub Actions jobs</text>
  <text x="20" y="240" font-size="13" fill="#57606a">The agent never holds a write token. Anything it wants to change is checked by the detection job and applied by the</text>
  <text x="20" y="260" font-size="13" fill="#57606a">safe-outputs job, within the limits declared in the workflow frontmatter. A conclusion job then reports the outcome.</text>
  <text x="20" y="285" font-size="11" fill="#8c959f">Adapted from the GitHub Agentic Workflows documentation (github/gh-aw, MIT License, (c) GitHub, Inc.).</text>
</svg>
